# Checks what a change touches, on the open-source edition only: nothing here runs code under enterprise/.
#   Frontend: type-check, lint and format-check the changed files, and run the unit tests related to them.
#   Backend:  clj-kondo and cljfmt on the changed files, the module-boundary checks, and the tests of the changed
#             modules.
# A pull request is compared with its base branch, a push to master with the commit before it.
# See bcc-docs/development/README.md.
name: BCC - CI

on:
  pull_request:
  push:
    branches: [master]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Find the changed parts
        id: changes
        run: |
          files=$(.github/scripts/bcc-ci-changes.sh files)
          echo "$files"
          frontend=false
          backend=false
          if grep -qE '\.(js|jsx|ts|tsx|mjs|cjs|mts|cts|css|cljc|cljs)$|^(package\.json|bun\.lock|tsconfig[^/]*\.json)$' <<<"$files"; then
            frontend=true
          fi
          if grep -qE '\.(clj|cljc|cljs|edn)$|^resources/migrations/' <<<"$files"; then
            backend=true
          fi
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          token: ${{ github.token }}
      - name: Set up Java and Clojure
        uses: ./.github/actions/bcc-setup-clojure
        with:
          cache-name: frontend
      - name: Cache Bun packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        # CI skips the postinstall hook, so the package patches are applied here.
        run: |
          bun install --frozen-lockfile
          bun run patch-package
      - name: Build the ClojureScript
        run: bun run build-pure:cljs
      - name: Type-check
        run: bun run type-check-pure
      - name: Lint and format-check the changed files
        run: |
          mapfile -t files < <(.github/scripts/bcc-ci-changes.sh frontend)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed JavaScript, TypeScript or CSS files."
            exit 0
          fi
          node_modules/.bin/oxfmt --check "${files[@]}"
          mapfile -t lint < <(printf '%s\n' "${files[@]}" | grep -E '^(frontend|e2e)/.*\.(js|jsx|ts|tsx|mjs|cjs|mts|cts)$' || true)
          if [ "${#lint[@]}" -gt 0 ]; then
            node frontend/lint/scripts/run-oxlint.mjs "${lint[@]}"
          fi
      # The unit tests in the changed files' folders. Jest's --findRelatedTests would follow the imports and pick most
      # of the suite for a change to a shared file.
      - name: Run the unit tests next to the changed files
        run: |
          mapfile -t tests < <(.github/scripts/bcc-ci-changes.sh frontend | grep -E '^(frontend|\.github)/' \
            | xargs -r -n1 dirname | sort -u \
            | xargs -r -I{} find {} -maxdepth 1 -name '*.unit.spec.*' -not -name '*.tz.unit.spec.*' | sort -u)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No unit tests next to the changed files."
            exit 0
          fi
          echo "Running ${#tests[@]} test files."
          node_modules/.bin/jest --runTestsByPath "${tests[@]}"

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Java and Clojure
        uses: ./.github/actions/bcc-setup-clojure
        with:
          cache-name: backend
      - name: Lint and format-check the changed files
        run: |
          mapfile -t files < <(.github/scripts/bcc-ci-changes.sh clojure)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Clojure files."
            exit 0
          fi
          ./bin/mage kondo "${files[@]}"
          ./bin/mage cljfmt-files --force-check "${files[@]}"
      - name: Check the module boundaries
        run: ./bin/test-agent --oss :only '[dev.modules-config-test metabase.core.module-cycles-test metabase.core.modules-test]'
      - name: Test the changed modules
        run: |
          tests=$(.github/scripts/bcc-ci-changes.sh backend-tests | paste -sd' ')
          if [ -z "$tests" ]; then
            echo "No backend tests relate to the changed files."
            exit 0
          fi
          echo "Testing: $tests"
          ./bin/test-agent --oss :only "[$tests]" :exclude-tags '[:mb/driver-tests :mb/old-migrations-test]'
