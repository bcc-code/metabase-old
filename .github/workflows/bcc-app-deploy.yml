# Builds the BCC Metabase image, pushes it to the environment's Artifact Registry and rolls it out on Cloud Run.
# See bcc-docs/hosting.md.
name: BCC - Build and deploy Metabase
run-name: Build and deploy Metabase ${{ inputs.version }} - ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        default: sandbox
        options:
          - sandbox
          - prod
      version:
        type: string
        description: Version Metabase shows, such as v0.66.0-bcc.1
        required: true

permissions: {}

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 150
    permissions:
      id-token: write
      contents: read
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      VERSION: ${{ inputs.version }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/metabase/metabase
      SERVICE: metabase

    steps:
      - name: Check the version
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::The version must look like v0.66.0-bcc.1"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The build needs more disk than a runner has free by default.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          # The provider that lets this repository's environments act as the project's sa-gha-cicd service account.
          workload_identity_provider: ${{ vars.GCP_CICD_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: sa-gha-cicd@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Build the image
        run: |
          docker build \
            --build-arg MB_EDITION=oss \
            --build-arg "VERSION=$VERSION" \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:$GITHUB_SHA" \
            --tag "$IMAGE:latest" \
            .

      - name: Push the image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker push --all-tags "$IMAGE"

      - name: Roll it out on Cloud Run
        run: |
          if ! gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" > /dev/null 2>&1; then
            echo "::notice::The Cloud Run service doesn't exist yet. Run BCC - Deploy Terraform with action apply to create it with this image."
            exit 0
          fi
          gcloud run services update "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE:$GITHUB_SHA"
