name: BCC - Set up Java and Clojure
description: Installs Java and the Clojure CLI and restores the Clojure dependency caches.

inputs:
  cache-name:
    description: Name of the dependency cache. Jobs that resolve different deps.edn aliases keep separate caches.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        distribution: temurin
        java-version: "25"

    # The official linux-install script, minus its unchecked download: the tools archive is checked against its
    # published SHA-256 first.
    - name: Install the Clojure CLI
      shell: bash
      env:
        CLOJURE_VERSION: 1.12.3.1577
        CLOJURE_SHA256: bbf8513ae88b9873e9781ae86adcb560b81209c66fe94cbe72428af39b1ebacc
      run: |
        set -euo pipefail
        prefix="$RUNNER_TEMP/clojure"
        archive="clojure-tools-$CLOJURE_VERSION.tar.gz"
        cd "$RUNNER_TEMP"
        curl --fail --silent --show-error --location --retry 3 --remote-name \
          "https://github.com/clojure/brew-install/releases/download/$CLOJURE_VERSION/$archive"
        echo "$CLOJURE_SHA256  $archive" | sha256sum --check -
        tar xzf "$archive"
        mkdir -p "$prefix/bin" "$prefix/lib/clojure/libexec"
        install -m644 clojure-tools/deps.edn clojure-tools/example-deps.edn clojure-tools/tools.edn "$prefix/lib/clojure/"
        install -m644 clojure-tools/*.jar "$prefix/lib/clojure/libexec/"
        sed -e "s@PREFIX@$prefix/lib/clojure@g" clojure-tools/clojure > "$prefix/bin/clojure"
        sed -e "s@BINDIR@$prefix/bin@g" clojure-tools/clj > "$prefix/bin/clj"
        chmod 755 "$prefix/bin/clojure" "$prefix/bin/clj"
        echo "$prefix/bin" >> "$GITHUB_PATH"
        "$prefix/bin/clojure" --version

    - name: Cache Clojure dependencies
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
          ~/.deps.clj
          bin/bb
        key: clojure-${{ inputs.cache-name }}-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn', 'shadow-cljs.edn') }}
        restore-keys: clojure-${{ inputs.cache-name }}-${{ runner.os }}-
