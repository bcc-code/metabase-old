# Builds the BCC Metabase image (OSS edition plus the fork's features) and pushes it to Artifact Registry.
# Run from the repository root; see infra/gcp/README.md.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=MB_EDITION=oss
      - --build-arg=VERSION=${_VERSION}
      - --tag=${_IMAGE}:${_VERSION}
      - .
images:
  - ${_IMAGE}:${_VERSION}
substitutions:
  _IMAGE: europe-north1-docker.pkg.dev/${PROJECT_ID}/metabase/metabase
  _VERSION: v0.66.0-bcc.1
options:
  # The build compiles the frontend and the backend: give it a large machine.
  machineType: E2_HIGHCPU_32
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
timeout: 7200s
